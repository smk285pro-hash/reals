[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    tier1: Tier 1 Feature & Contract Tests
    tier2: Tier 2 Boundary & Corner Case Tests
    tier3: Tier 3 Combinatorial Matrix Tests
    tier4: Tier 4 Real-World Scenario Tests
